name: Reset demo data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reset endpoint
        run: |
          status=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.DEMO_RESET_URL }}")
          cat /tmp/body
          echo
          if [ "$status" != "200" ]; then
            echo "Reset failed with HTTP $status"
            exit 1
          fi
